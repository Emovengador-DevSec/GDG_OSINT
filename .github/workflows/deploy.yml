name: Deploy GDG_OSINT

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar suite con Node.js
        run: pnpm run build

      - name: Desplegar a Firebase Hosting
        run: |
          pnpm dlx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project gdg-osint
